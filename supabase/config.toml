# Local project identifier only; this does NOT link a hosted project.
project_id = "academy-core-dev"
[api]
enabled = true
port = 54321
schemas = ["academy_api"]
extra_search_path = ["public", "extensions"]
max_rows = 500
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.sms]
enable_signup = false
enable_confirmations = true
